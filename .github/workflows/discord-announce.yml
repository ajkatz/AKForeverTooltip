# Copied from ajkatz/discord-hub templates/discord-announce.yml.
# Secrets in this repo: DISCORD_WEBHOOK_URL (required),
# ANTHROPIC_API_KEY (optional; without it the post is a plain commit list).
name: Announce pushes to Discord

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: discord-announce-${{ github.ref }}
  cancel-in-progress: false

jobs:
  announce:
    uses: ajkatz/discord-hub/.github/workflows/announce.yml@main
    with:
      project_name: "Forever Tooltip"
      project_description: "WoW: Forever - the game tooltip follows your mouse and says what Blizzard leaves out: health and power, who they target, range, pet mood, ids, class colours"
    secrets: inherit
